<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lucky Lux Mini Slot (Embedded)</title>
<style>
/* ===== Mini Slot (single-file) ===== */
#slot-mini { --bg:#0b1018; --chrome:#1b2432; --ring:rgba(255,255,255,.14);
  --yellow:#ffe36b; --yellow2:#ffd04d; --red:#ff3b47; --neon:#5bf5ff; --neon2:#ff5fb7;
  --text:#eaf4ff; --muted:#89a1be; --win:#39e6a7; --lose:#ff6b6b;
  width:100%; max-width:360px; margin:0 auto; color:var(--text);
  font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial;
}
#slot-mini * { box-sizing:border-box; }

/* Header JACKPOT sign */
#slot-mini .head{ display:flex; justify-content:center; margin-bottom:8px; }
#slot-mini .jackpot-sign{
  min-width: 220px; padding:6px 12px; border-radius: 12px 12px 18px 18px;
  background: linear-gradient(180deg, #ffe36b, #ffd24e 60%, #ffb43b 100%);
  box-shadow: 0 6px 0 #bd7d00, 0 0 0 2px #704c00 inset, 0 8px 24px rgba(0,0,0,.35);
  display:flex; align-items:center; justify-content:center; gap:8px;
}
#slot-mini .flash .jackpot-sign{ animation: flashGlow .15s linear infinite; }
@keyframes flashGlow{ 0%,100%{ filter: brightness(1);} 50%{ filter: brightness(1.4) saturate(1.2);} }
#slot-mini .jackpot-sign .text{
  font-weight:900; letter-spacing:1px; color:#b30202; text-shadow:0 2px 0 #fff8;
}
#slot-mini .jackpot-sign .cards{ font-size:12px; }

/* Cabinet */
#slot-mini .cabinet{
  position:relative; background: linear-gradient(180deg, #111926, #0b111b);
  border-radius: 14px; padding:10px 10px 12px; display:grid; grid-template-columns: 1fr 44px; gap:8px;
  box-shadow: 0 14px 30px rgba(0,0,0,.45), 0 0 0 1px var(--ring) inset;
}
#slot-mini .window{
  position:relative; border-radius:10px; overflow:hidden; background:#0a1120;
  box-shadow: inset 0 0 0 1px var(--ring), inset 0 -24px 48px rgba(0,0,0,.35);
}
#slot-mini .reels{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:6px; }
#slot-mini .reel{ position:relative; height:144px; border-radius:8px; overflow:hidden; background:#0a0f1a;
  box-shadow: inset 0 0 0 1px var(--ring), inset 0 -18px 36px rgba(0,0,0,.35);
}
#slot-mini .symbol{
  height:48px; display:flex; align-items:center; justify-content:center;
  font-weight:900; font-size:22px; user-select:none;
  color:#eaeef5; text-shadow:0 1px 0 rgba(0,0,0,.5), 0 0 10px rgba(255,255,255,.12);
}
#slot-mini .symbol[data-name="SEVEN"]{ color:var(--red); text-shadow:0 1px 0 #540000, 0 0 14px rgba(255,59,71,.35); }

/* Celebration toast */
#slot-mini .toast{
  position:absolute; left:8px; right:8px; top:8px;
  border-radius:10px; padding:8px 10px; text-align:center; font-weight:900;
  background: rgba(0,0,0,.45); backdrop-filter: blur(3px);
  box-shadow: inset 0 0 0 1px var(--ring);
}
#slot-mini .toast.win{ color:var(--win); }
#slot-mini .toast.lose{ color:var(--lose); }
#slot-mini .toast.hidden{ display:none; }

/* Sheen */
#slot-mini .sheen{
  pointer-events:none; position:absolute; inset:0; border-radius:10px;
  background:
    linear-gradient(75deg, rgba(255,255,255,.18), rgba(255,255,255,0) 40%),
    radial-gradient(90% 60% at 10% 0%, rgba(255,255,255,.07), transparent 60%);
}

/* Lever */
#slot-mini .lever{ position:relative; display:flex; align-items:center; justify-content:center; }
#slot-mini .shaft{ width:8px; height:120px; border-radius:10px; background:linear-gradient(180deg,#3f4c63,#16202d); box-shadow: inset 0 0 0 1px var(--ring); }
#slot-mini .knob{
  position:absolute; bottom:-6px; width:40px; height:40px; border:0; border-radius:999px; cursor:pointer;
  background: radial-gradient(circle at 30% 30%, #fff, #ffd8a3 34%, #ffb24d 64%);
  box-shadow: 0 8px 14px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.45);
  transition: transform .12s cubic-bezier(.2,.8,.2,1);
}
#slot-mini .knob.pulled{ animation: leverSpring .35s cubic-bezier(.2,.8,.2,1); }
@keyframes leverSpring{ 0%{transform:translateY(0)} 60%{transform:translateY(18px)} 100%{transform:translateY(0)} }

/* Progress */
#slot-mini .progress{ height:6px; margin:8px 4px 6px; border-radius:8px; background:#0c1421; overflow:hidden; box-shadow: inset 0 0 0 1px var(--ring); }
#slot-mini .progress .bar{
  width:0%; height:100%; background: linear-gradient(90deg, var(--neon), var(--neon2));
  box-shadow: 0 0 10px var(--neon), 0 0 12px var(--neon2);
}
#slot-mini.spinning .progress .bar::after{
  content:""; position:absolute; inset:0; transform:translateX(-100%);
  background: linear-gradient(120deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.35) 40%, rgba(255,255,255,0) 80%);
  animation: shimmer 1.1s ease-in-out infinite;
}
@keyframes shimmer{ to { transform: translateX(100%); } }

/* Controls */
#slot-mini .controls{ display:grid; grid-template-columns: 1fr auto auto auto; gap:6px; align-items:center; }
#slot-mini .credit{ background:#0d1624; padding:8px 10px; border-radius:10px; box-shadow: inset 0 0 0 1px var(--ring); }
#slot-mini .credit strong{ color:var(--win); }
#slot-mini .bet{ display:flex; align-items:center; gap:6px; }
#slot-mini .bet-window{
  background:#0d1624; padding:4px 8px; border-radius:10px; box-shadow: inset 0 0 0 1px var(--ring);
  display:flex; flex-direction:column; align-items:center;
}
#slot-mini .bet-window span{ font-size:11px; color:var(--muted); }
#slot-mini .bet-window input{ width:68px; text-align:center; font-weight:900; font-size:16px; color:var(--text); background:transparent; border:0; outline:none; }

#slot-mini .batch{ display:flex; align-items:center; gap:6px; }
#slot-mini .batch label{ font-size:12px; color:var(--muted); }
#slot-mini .batch select{
  background:#0d1624; color:#eaf4ff; border:0; border-radius:10px; padding:6px 8px;
  box-shadow: inset 0 0 0 1px var(--ring);
}

#slot-mini .btn{
  appearance:none; border:0; border-radius:12px; padding:10px 12px; font-weight:900; cursor:pointer; color:#05121b;
  box-shadow: 0 2px 0 rgba(0,0,0,.35), 0 0 0 1px var(--ring) inset; transition: transform .05s ease, filter .15s ease, opacity .2s ease;
}
#slot-mini .btn:active{ transform: translateY(1px); }
#slot-mini .btn:disabled{ opacity:.5; cursor:not-allowed; }
#slot-mini .btn.retro{ background: linear-gradient(180deg,#ffe08a,#ffb86b 60%,#d97a2b 100%); color:#2b1700; text-shadow:0 1px 0 rgba(255,255,255,.5); }
#slot-mini .btn.spin{ background: linear-gradient(180deg,#7cf7ff,#4fd3ff 60%,#2c6f9d 100%); color:#001620; text-shadow:0 1px 0 rgba(255,255,255,.6); }

#slot-mini .status{ margin-top:6px; display:flex; justify-content:space-between; align-items:center; min-height:24px; }
#slot-mini .msg{ color:var(--muted); font-size:12px; }
#slot-mini .payout{ color:var(--win); font-weight:900; font-size:12px; }

/* Rewards mount */
#slot-mini .rewards{ margin-top:6px; display:flex; flex-wrap:wrap; gap:6px; min-height:24px; }
#slot-mini .reward-pill{
  border-radius:999px; padding:4px 8px; font-size:12px; font-weight:800;
  color:#001620; background: linear-gradient(180deg,#7cf7ff,#4fd3ff 60%,#2c6f9d 100%);
  box-shadow: 0 1px 0 rgba(0,0,0,.35), 0 0 0 1px var(--ring) inset;
}

/* Spin blur + reduced motion */
#slot-mini.spinning .symbol{ filter: blur(1px) brightness(1.04); }
@media (prefers-reduced-motion: reduce){
  #slot-mini .knob, #slot-mini .progress .bar, #slot-mini .reel, #slot-mini .jackpot-sign { transition: none !important; animation: none !important; }
  #slot-mini.spinning .symbol{ filter:none; }
}

/* Modal */
#slot-mini .modal{ position:fixed; inset:0; display:grid; place-items:center; z-index: 999; }
#slot-mini .modal.hidden{ display:none; }
#slot-mini .modal .backdrop{ position:absolute; inset:0; background: rgba(0,0,0,.6); backdrop-filter: blur(2px); }
#slot-mini .modal .panel{
  position:relative; width:min(92vw, 360px); max-height:85vh; overflow:auto;
  background: #0c141d; border-radius: 16px; padding: 16px;
  box-shadow: 0 0 0 1px var(--ring), 0 24px 80px rgba(0,0,0,.55);
}
#slot-mini .modal .mclose{
  position:absolute; right:8px; top:8px; border:0; border-radius:10px; padding:6px 10px;
  background:#1b2531; color:#cbd5e1; box-shadow: inset 0 0 0 1px var(--ring); cursor:not-allowed;
}
#slot-mini .modal .mclose.enabled{ cursor:pointer; }
#slot-mini .modal .content .field{ display:flex; flex-direction:column; gap:6px; margin:10px 0; }
#slot-mini .modal .content input{
  padding:12px 14px; border-radius:10px; background:#0f1a26; color:var(--text); border:0;
  box-shadow: inset 0 0 0 1px var(--ring); font-size:16px;
}
#slot-mini .modal .content .checkbox{ flex-direction:row; align-items:center; gap:8px; }
#slot-mini .modal .content .btn{ width:100%; }
</style>
</head>
<body style="background:#061018; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:12px;">
  <div id="slot-mini" role="application" aria-label="Lucky Lux Slot">
    <div class="head" aria-hidden="true">
      <div class="jackpot-sign">
        <span class="cards">🂡🂮🂭🂫</span>
        <span class="text">JACKPOT</span>
      </div>
    </div>

    <div class="cabinet">
      <div class="window">
        <div class="reels" id="smReels">
          <div class="reel" data-reel="0"></div>
          <div class="reel" data-reel="1"></div>
          <div class="reel" data-reel="2"></div>
        </div>
        <div class="sheen" aria-hidden="true"></div>
        <div id="smToast" class="toast hidden" aria-live="polite"></div>
      </div>

      <aside class="lever">
        <div class="shaft" aria-hidden="true"></div>
        <button id="smLever" class="knob" aria-label="Pull lever" aria-pressed="false"></button>
      </aside>
    </div>

    <div class="progress" aria-hidden="true"><div id="smProg" class="bar"></div></div>

    <div class="controls">
      <div class="credit"><span>Credits</span><strong id="smCredits">100</strong></div>

      <div class="bet" aria-label="Bet controls">
        <button id="smBetMinus" class="btn retro" aria-label="Decrease bet">−</button>
        <div class="bet-window">
          <span>Bet</span>
          <input id="smBet" type="number" min="1" step="1" value="10" inputmode="numeric" />
        </div>
        <button id="smBetPlus" class="btn retro" aria-label="Increase bet">+</button>
      </div>

      <div class="batch">
        <label for="smBatch">Spins</label>
        <select id="smBatch" aria-label="Number of spins">
          <option value="1" selected>1</option>
          <option value="10">10</option>
        </select>
      </div>

      <button id="smSpin" class="btn spin retro" aria-label="Bet and Spin">BET &amp; SPIN</button>
    </div>

    <div class="status" role="status" aria-live="polite">
      <div id="smMsg" class="msg">Pull the lever or press SPIN</div>
      <div id="smPayout" class="payout"></div>
    </div>

    <div id="smRewards" class="rewards" aria-live="polite" aria-label="Rewards earned"></div>

    <!-- Modal (claim flow) -->
    <div id="smModal" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="backdrop"></div>
      <div class="panel" role="document" tabindex="-1">
        <button id="smModalClose" class="mclose" aria-label="Close" disabled>✕</button>
        <div id="smModalContent" class="content"></div>
      </div>
    </div>
  </div>

<script>
(() => {
  // ===== CONFIG (BACKEND_CONFIG:*) =====
  const CONFIG = {
    ui: { celebrationMs: 1200, flashyLights: true },
    flow:   { requireClaim: true, persistAfterClaim: true },
    credits:{ start:100, minBet:1, maxBet:999 },
    batch:  { options:[1,10], default:1, delayMs: 700 },  // visible gap between spins

    symbols: [
      { name:"SEVEN", display:"7",   payout:100, weight:1 },
      { name:"BAR",   display:"BAR", payout:40,  weight:2 },
      { name:"BELL",  display:"🔔",  payout:25,  weight:3 },
      { name:"CHERRY",display:"🍒",  payout:15,  weight:5 },
      { name:"LEMON", display:"🍋",  payout:10,  weight:6 },
      { name:"GRAPE", display:"🍇",  payout:10,  weight:6 },
      { name:"STAR",  display:"⭐",  payout:20,  weight:4 },
    ],
    reelWeights: [
      { SEVEN:1, BAR:2, BELL:3, CHERRY:6, LEMON:7, GRAPE:7, STAR:5 },
      { SEVEN:1, BAR:3, BELL:3, CHERRY:5, LEMON:6, GRAPE:6, STAR:5 },
      { SEVEN:1, BAR:2, BELL:4, CHERRY:5, LEMON:6, GRAPE:6, STAR:5 },
    ],
    reels:3, rows:3,
    paylines: [ [0,0,0],[1,1,1],[2,2,2] ],
    payRules: [
      { id:"JACKPOT_777", tier:"JACKPOT", test:(s)=> s.every(x=>x==="SEVEN"),
        payout:(sym,bet)=> sym.payout * bet },
      { id:"THREE_OF_A_KIND", tier:"ANY_TRIPLE", test:(s)=> s[0]===s[1] && s[1]===s[2],
        payout:(sym,bet)=> sym.payout * bet * 0.5 },
    ],

    /* Rewards map with probabilities (weights) */
    rewards: {
      mountSelector: "#smRewards", // BACKEND_CONFIG:REWARD_MOUNT
      JACKPOT:   [ { label:"Grand Prize", prob:1, action:{type:"custom", id:"grand"} } ],
      ANY_TRIPLE:[ { label:"₹500 Coupon", prob:2, action:{type:"custom", id:"coupon500"} },
                   { label:"+100 Credits", prob:3, action:{type:"credit", amount:100} } ],
      ANY_WIN:   [ { label:"₹100 Coupon", prob:4, action:{type:"custom", id:"coupon100"} },
                   { label:"+25 Credits", prob:6, action:{type:"credit", amount:25} } ],
      NO_WIN:    [ { label:"Better luck next time", prob:1, action:{type:"custom", id:"none"} } ]
    },

    hooks: {
      async auditSpin(payload){ /* POST to /api/audit */ },
      async submitClaim(payload){ /* POST to /api/claim */ },
      onReward(reward){ /* host integration */ },
      onBatchEnd(sum){ /* host integration */ },
      onWinInterstitial(info){ /* host integration */ }
    },

    anim: { times:[1150,1400,1650] } // per-reel spin durations
  };

  // ===== DOM =====
  const root = document.getElementById("slot-mini");
  const q = (s)=> root.querySelector(s);
  const reelsEl = q("#smReels");
  const spinBtn = q("#smSpin");
  const leverBtn = q("#smLever");
  const betIn = q("#smBet");
  const betMinus = q("#smBetMinus");
  const betPlus = q("#smBetPlus");
  const batchSel = q("#smBatch");
  const creditsEl = q("#smCredits");
  const msgEl = q("#smMsg");
  const payoutEl = q("#smPayout");
  const progEl = q("#smProg");
  const toast = q("#smToast");
  const rewardMount = q(CONFIG.rewards.mountSelector);
  const modal = q("#smModal");
  const modalContent = q("#smModalContent");
  const modalClose = q("#smModalClose");

  // ===== State =====
  const LS_KEY = "slot.mini.claimed";
  const state = {
    credits: CONFIG.credits.start,
    spinning:false,
    claimed: CONFIG.flow.persistAfterClaim && localStorage.getItem(LS_KEY)==="1",
    lastOutcome:null, lastWin:0, lastTier:"NO_WIN",
    batching:false
  };

  // ===== Odds =====
  const byName = (n)=> CONFIG.symbols.find(s=>s.name===n);
  const TABLES = Array.from({length:CONFIG.reels}, (_,i)=>{
    const r = CONFIG.reelWeights[i] || {}; const t=[];
    for (const s of CONFIG.symbols){ const w=r[s.name] ?? s.weight ?? 1; for (let k=0;k<w;k++) t.push(s.name); }
    return t;
  });

  // ===== UI helpers =====
  const symH = ()=> (root.querySelector(".symbol")?.getBoundingClientRect().height|0) || 48;
  const setMsg=(t,tone="muted")=>{ msgEl.textContent=t; msgEl.style.color = tone==="win"?"#39e6a7":tone==="lose"?"#ff6b6b":"#89a1be"; };
  const setPayout=(t)=>{ payoutEl.textContent = t||""; };
  const setCredits=(v)=>{ state.credits = Math.max(0, v); creditsEl.textContent = state.credits; };
  const clampBet=(v)=>{ v=Math.max(CONFIG.credits.minBet, Math.min(CONFIG.credits.maxBet, v|0||CONFIG.credits.minBet)); betIn.value=v; return v; };
  const progress=(p)=>{ progEl.style.width = `${Math.max(0,Math.min(100,p))}%`; };
  const setSpinning=(on)=>{ root.classList.toggle("spinning",!!on); leverBtn.setAttribute("aria-pressed",on?"true":"false"); };
  const lockUI=(on)=>{ spinBtn.disabled=on; betIn.disabled=on; betMinus.disabled=on; betPlus.disabled=on; batchSel.disabled=on; };
  const makeReelFrag=()=>{
    const f=document.createDocumentFragment(); const pool=CONFIG.symbols.map(s=>s.name);
    for (let i=0;i<9;i++){ const name=pool[i%pool.length]; const d=document.createElement("div");
      d.className="symbol"; d.dataset.name=name; d.textContent=byName(name).display; f.appendChild(d);}
    return f;
  };
  function populate(){ reelsEl.querySelectorAll(".reel").forEach(r=>{ r.innerHTML=""; r.style.transform=""; r.appendChild(makeReelFrag()); }); }
  const renderReward=(reward)=>{ if (!reward || !rewardMount) return; const pill=document.createElement("span"); pill.className="reward-pill"; pill.textContent=reward.label||"Reward"; rewardMount.appendChild(pill); };
  const celebrate=(tier,total)=>{
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const win = total>0;
    toast.textContent = win ? (tier==="JACKPOT" ? "MEGA WIN!" : `YOU WIN ${total}!`) : "BETTER LUCK NEXT TIME";
    toast.className = `toast ${win?"win":"lose"}`; toast.classList.remove("hidden");
    if (CONFIG.ui.flashyLights && !reduced) root.classList.add("flash");
    const ms = reduced ? 400 : CONFIG.ui.celebrationMs;
    return new Promise(res=> setTimeout(()=>{ toast.classList.add("hidden"); root.classList.remove("flash"); res(); }, ms));
  };

  // ===== Modal =====
  function openModal(html){
    modalContent.innerHTML = html;
    modal.classList.remove("hidden"); modal.setAttribute("aria-hidden","false");
    const first = modalContent.querySelector("input,button"); if (first) first.focus({preventScroll:true});
    trapFocus(true);
  }
  function closeModal(){ modal.classList.add("hidden"); modal.setAttribute("aria-hidden","true"); modalContent.innerHTML=""; trapFocus(false); }
  function trapFocus(enable){
    function handler(e){
      if (!enable || e.key!=="Tab") return;
      const list=[...modal.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(el=>!el.disabled && el.offsetParent!==null);
      if (!list.length) return; const first=list[0], last=list[list.length-1];
      if (e.shiftKey && document.activeElement===first){ last.focus(); e.preventDefault(); }
      else if (!e.shiftKey && document.activeElement===last){ first.focus(); e.preventDefault(); }
    }
    if (enable){ document.addEventListener("keydown", handler); modalClose.disabled=true; modalClose.classList.remove("enabled"); modalClose.onclick=null; }
    else { document.removeEventListener("keydown", handler); modalClose.disabled=false; modalClose.classList.add("enabled"); modalClose.onclick=closeModal; }
  }
  const claimFormHTML = (win,tier)=>`
    <h2 style="margin:0 0 6px;">Claim Your Reward</h2>
    <p class="message">Result: <strong>${tier}</strong>${win>0?` — You won <strong>${win}</strong>.`:"."}</p>
    <form id="smClaim" novalidate>
      <div class="field"><label for="email">Email ID</label>
        <input id="email" type="email" required placeholder="you@example.com" inputmode="email"/></div>
      <div class="field"><label for="phone">Phone Number</label>
        <input id="phone" type="tel" required placeholder="+91 90000 00000" inputmode="tel"/></div>
      <div class="field checkbox">
        <input id="consent" type="checkbox"/><label for="consent">I agree to receive communications</label>
      </div>
      <button id="claimBtn" class="btn spin" type="submit" disabled>Submit &amp; Claim</button>
    </form>
    <small class="disclaimer" style="color:#86a1be">Submitting details is mandatory to claim rewards.</small>
  `;
  const thankYouHTML = `
    <h2 style="margin:0 0 6px;">Thank you for submitting 🎉</h2>
    <p class="message">You will receive your details over email.</p>
    <button id="okBtn" class="btn retro">OK</button>
  `;
  const vEmail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
  const vPhone=v=>/^\+?\d[\d\s-]{7,15}$/.test(v.trim());
  function wireClaimForm(){
    const form = modalContent.querySelector("#smClaim"); if (!form) return;
    const email=form.querySelector("#email"), phone=form.querySelector("#phone"), consent=form.querySelector("#consent"), btn=form.querySelector("#claimBtn");
    const validate=()=>{ const ok=vEmail(email.value)&&vPhone(phone.value)&&consent.checked; btn.disabled=!ok; return ok; };
    email.addEventListener("input",validate); phone.addEventListener("input",validate); consent.addEventListener("change",validate); setTimeout(validate,60);
    form.addEventListener("submit", async e=>{
      e.preventDefault(); if (!validate()) return;
      try{ await CONFIG.hooks.submitClaim({ email:email.value.trim(), phone:phone.value.trim(), consent:!!consent.checked, result:state.lastOutcome, winAmount:state.lastWin, tier:state.lastTier }); }catch(_){}
      state.claimed=true; if (CONFIG.flow.persistAfterClaim) localStorage.setItem(LS_KEY,"1");
      modalContent.innerHTML = thankYouHTML;
      modalClose.disabled=false; modalClose.classList.add("enabled"); modalClose.onclick=closeModal;
      modalContent.querySelector("#okBtn").addEventListener("click", closeModal);
      setMsg("Reward claimed. Check your email.","win");
    });
  }

  // ===== Core logic =====
  function outcome(){
    const rows=3, cols=3, g=Array.from({length:rows},()=>Array(cols));
    for (let c=0;c<cols;c++){
      const t=TABLES[c], L=Math.max(32, t.length*2), strip=Array.from({length:L},()=> t[(Math.random()*t.length)|0]);
      const stop=(Math.random()*L)|0; g[0][c]=strip[(stop-1+L)%L]; g[1][c]=strip[stop]; g[2][c]=strip[(stop+1)%L];
    }
    return g;
  }
  function evaluate(grid, bet){
    let total=0, wins=[], tier=null;
    for (const line of CONFIG.paylines){
      const names=line.map((row,col)=>grid[row][col]);
      for (const rule of CONFIG.payRules){
        if (rule.test(names)){
          const amt=rule.payout(byName(names[0]),bet); total+=amt;
          wins.push({line, rule:rule.id, sym:names[0], amt}); tier = tier || rule.tier;
        }
      }
    }
    return { total, wins, tier: tier || (total>0?"ANY_WIN":"NO_WIN") };
  }
  function pickReward(tier){
    const list = CONFIG.rewards[tier] || CONFIG.rewards.ANY_WIN;
    const sum = list.reduce((a,b)=>a+(b.prob||1),0);
    let r = Math.random()*sum;
    for (const item of list){ r -= (item.prob||1); if (r<=0) return item; }
    return list[list.length-1];
  }

  async function spinOnce(){
    const bet = clampBet(+betIn.value);
    if (state.credits < bet) { setMsg("Not enough credits","lose"); return null; }

    // UI start
    setCredits(state.credits - bet);
    setPayout(""); setMsg("Spinning...");
    state.spinning=true; setSpinning(true); progress(0); lockUI(true);
    leverBtn.classList.add("pulled");

    const grid = outcome(); state.lastOutcome = grid;

    // Animate reels
    const reels=[...reelsEl.querySelectorAll(".reel")];
    const h = symH(); const times=CONFIG.anim.times; const t0=performance.now();

    const anims = reels.map((reel,i)=> new Promise((res)=>{
      const dur = times[i] || times[times.length-1];
      const loop=(t)=>{
        const e=Math.min(1,(t-t0)/dur), ease=1-Math.pow(1-e,3), offset=(1-ease)*16*h + ease*4*h;
        reel.style.transform=`translateY(${-(offset % (h*3))}px)`;
        progress(Math.round(e*100*(i+1)/reels.length));
        if (e<1) requestAnimationFrame(loop);
        else {
          reel.innerHTML="";
          const names=[grid[0][i],grid[1][i],grid[2][i]];
          const order=[names[0],...names,names[2],names[1],names[2],names[0]];
          for (const n of order){ const d=document.createElement("div"); d.className="symbol"; d.dataset.name=n; d.textContent=byName(n).display; reel.appendChild(d);}
          reel.style.transform=`translateY(${-h}px)`; res();
        }
      }; requestAnimationFrame(loop);
    }));
    await Promise.all(anims);

    // Settle
    setSpinning(false); state.spinning=false; progress(100); leverBtn.classList.remove("pulled");

    const { total, wins, tier } = evaluate(grid, bet);
    state.lastWin = total; state.lastTier = tier;

    if (total>0){
      setCredits(state.credits + total);
      setMsg(`You win ${total}!`,"win");
      setPayout(wins.map(w=>`[${w.line.join(",")}] ${w.rule} ${w.sym} +${w.amt}`).join(" | "));
    } else { setMsg("No win this time.","lose"); setPayout(""); }

    // Reward
    const reward = pickReward(tier);
    if (reward?.action?.type==="credit") setCredits(state.credits + reward.action.amount);
    renderReward(reward);
    try{ await CONFIG.hooks.auditSpin({ grid, bet, total, tier, reward }); }catch(_){}
    CONFIG.hooks.onReward?.(reward);

    // Celebration BEFORE claim/modal
    await celebrate(tier, total);
    CONFIG.hooks.onWinInterstitial?.({ tier, total });

    lockUI(false);
    return { bet, total, tier, reward };
  }

  async function runBatch(count){
    state.batching = true; lockUI(true);
    const results=[]; let creditsDelta=0;

    for (let i=0;i<count;i++){
      setMsg(`Spin ${i+1} of ${count}...`);
      const r = await spinOnce();
      if (!r) break;
      results.push(r);
      creditsDelta += (r.total - r.bet) + (r.reward?.action?.type==="credit" ? r.reward.action.amount : 0);
      // short pause so each spin is visible and distinct
      if (i < count-1) await new Promise(res=>setTimeout(res, CONFIG.batch.delayMs || 700));
    }

    // Summary toast
    const wins = results.filter(r=>r.total>0).length;
    const rewardLabels = results.map(r=>r.reward?.label).filter(Boolean);
    const summary = wins>0 || rewardLabels.length
      ? `SUMMARY: Spins ${results.length}, Wins ${wins}, Rewards: ${rewardLabels.join(", ") || "—"}`
      : `SUMMARY: ${results.length} spins — Better luck next time.`;
    toast.textContent = summary;
    toast.className = "toast win";
    toast.classList.remove("hidden");
    setTimeout(()=>toast.classList.add("hidden"), 2500);

    CONFIG.hooks.onBatchEnd?.({ spins: results.length, rewards: rewardLabels, totalPayout: results.reduce((a,b)=>a+b.total,0), totalCreditsDelta: creditsDelta });

    // Claim gate after batch
    if (CONFIG.flow.requireClaim && results.length>0){
      openModal(claimFormHTML(state.lastWin, state.lastTier));
      wireClaimForm();
    }

    lockUI(false); state.batching=false;
  }

  function canSpin(){
    if (state.spinning || state.batching) return false;
    if (CONFIG.flow.persistAfterClaim && state.claimed) return false;
    return state.credits >= clampBet(+betIn.value);
  }

  // ===== Wire =====
  spinBtn.addEventListener("click", async ()=>{
    if (!canSpin()){
      setMsg(CONFIG.flow.persistAfterClaim && state.claimed ? "Already claimed. Spins disabled." : "Not allowed to spin now."); return;
    }
    const n = parseInt(batchSel.value,10) || 1;
    await runBatch(n);
  });
  leverBtn.addEventListener("click", ()=> spinBtn.click());
  betMinus.addEventListener("click", ()=> clampBet(+betIn.value - 1));
  betPlus.addEventListener("click", ()=> clampBet(+betIn.value + 1));

  // ===== Boot =====
  function init(){
    // spins selector (if you want different options, edit CONFIG.batch.options)
    batchSel.innerHTML = CONFIG.batch.options.map(v=>`<option value="${v}" ${v===CONFIG.batch.default?'selected':''}>${v}</option>`).join("");
    clampBet(+betIn.value||CONFIG.credits.minBet);
    // initial symbols for height calc
    populate(); setCredits(CONFIG.credits.start);
    if (CONFIG.flow.persistAfterClaim && state.claimed){ setMsg("Reward already claimed.","win"); lockUI(true); }
    else setMsg("Pull the lever or press SPIN");
    // iOS double-tap zoom guard
    let lt=0; root.addEventListener("touchend",(e)=>{ const n=Date.now(); if(n-lt<=350) e.preventDefault(); lt=n; }, {passive:false});
  }
  init();
})();
</script>
